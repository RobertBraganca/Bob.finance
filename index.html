<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finanças</title>
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo-red.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Só os pesos que o app usa, medido no DOM das 16 rotas em 02/09/2026:
      Barlow Condensed 400 (o campo numérico, que herda o peso do input) e
      600 (todo o resto do display); Inter 400, 500, 600 e 700.

      O pedido anterior trazia 9 faces de Barlow Condensed e 6 de Inter, com
      itálico nas duas. Barlow Condensed no Google é estática, uma face por
      peso, então cada peso extra era um arquivo baixado para nada; e o app
      não tem uma única tag <em> ou <i>, nem regra de `font-style: italic`.
      Inter fica na faixa variável 400..700, que o Google serve como um
      arquivo só.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600&family=Inter:opsz,wght@14..32,400..700&display=swap"
      rel="stylesheet"
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
